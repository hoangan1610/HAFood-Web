<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- rough ring -->
  <circle cx="100" cy="100" r="86" fill="none" stroke="#9BC7EE" stroke-width="12"
          stroke-dasharray="18 10 6 14 22 8 14 12 7 16 10 20" stroke-linecap="round" filter="url(#softShadow)" />
  <!-- solid inner disc -->
  <circle cx="100" cy="100" r="72" fill="#D3EAFE" />
  
  <!-- flask body -->
  <path d="M82 78 L118 78 M98 78 L98 92 L82 132 Q78 140 86 146 L114 146 Q122 140 118 132 L102 92 L102 78"
        fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- liquid -->
  <path d="M88 122 Q96 118 104 124 Q110 127 114 126" fill="none" stroke="#fff" stroke-width="6"/>
  <!-- bubbles -->
  <circle cx="92" cy="106" r="4" fill="#fff"/>
  <circle cx="104" cy="112" r="3" fill="#fff"/>
  <!-- shield -->
  <path d="M128 96 L142 100 L142 114 Q138 124 128 128 Q118 124 114 114 L114 100 Z"
        fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>

</svg>